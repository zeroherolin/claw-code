name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 rg、bfs、ugrep
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep bfs ugrep
          else sudo apt-get update && sudo apt-get install -y ripgrep bfs ugrep; fi
      - name: 获取本平台的官方可执行程序（对比测试用）
        run: |
          version=$(node -p 'require("./package.json").version')
          pkg=claude-code-${{ matrix.platform }}
          mkdir -p extract/upstream && cd extract/upstream
          npm pack "@anthropic-ai/$pkg@$version"
          mkdir "$pkg" && tar -xzf "anthropic-ai-$pkg-$version.tgz" --strip-components=1 -C "$pkg"
          rm ./*.tgz
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:parity
